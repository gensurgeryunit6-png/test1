<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Academic Schedule · IGMCRI</title><link rel="stylesheet" href="style.css"></head><body><script src="shared.js"></script><script>shell('UG & PG Academic Schedule',`<div class="panel"><h2>Verified source timetable</h2><p class="muted">October–November PG sessions transcribed from the supplied source documents. Faculty spellings are preserved as printed, including variations that need confirmation. Phase 2 UG sessions are included from the supplied timetable.</p><div class="toolbar"><label>Programme<select id="a" onchange="render()"><option value="">All</option><option>UG</option><option>PG</option></select></label><label>Month<select id="m" onchange="render()"><option value="">All months</option></select></label><label>Batch<select id="b" onchange="render()"><option value="">All batches</option></select></label><label>Faculty<select id="f" onchange="render()"><option value="">All faculty</option></select></label><label>PG / Presenter<select id="p" onchange="render()"><option value="">All PG presenters</option></select></label><label>Search<input id="q" oninput="render()" placeholder="Topic / venue"></label><button onclick="exportCSV()">Download CSV</button><button onclick="print()">Print / PDF</button></div><div class="scroll"><table><thead><tr><th>Date</th><th>Time</th><th>UG/PG</th><th>Batch</th><th>Type</th><th>Topic</th><th>Presenter</th><th>Senior faculty</th><th>Junior faculty</th><th>Venue</th><th>WhatsApp</th></tr></thead><tbody id="rows"></tbody></table></div><div id="notice" class="status"></div></div>`);let all=[];function options(id,values){document.getElementById(id).innerHTML='<option value="">All</option>'+[...new Set(values.filter(Boolean))].sort().map(v=>'<option>'+esc(v)+'</option>').join('')}function filtered(){let a=document.getElementById('a').value,m=document.getElementById('m').value,b=document.getElementById('b').value,f=document.getElementById('f').value,p=document.getElementById('p').value,q=document.getElementById('q').value.toLowerCase();return all.filter(x=>(!a||x.audience===a)&&(!m||x.date.startsWith(m))&&(!b||x.batch===b)&&(!f||[x.senior,x.junior].join(' ').includes(f))&&(!p||x.presenter===p)&&(!q||JSON.stringify(x).toLowerCase().includes(q)))}function render(){window.filteredRows=filtered();document.getElementById('rows').innerHTML=window.filteredRows.map((x,i)=>'<tr>'+['date','time','audience','batch','type','topic','presenter','senior','junior','venue'].map(k=>'<td>'+esc(x[k])+'</td>').join('')+'<td><button data-i="'+i+'">Share</button></td></tr>').join('')||'<tr><td colspan="11">No sessions match</td></tr>'}document.getElementById('rows').addEventListener('click',e=>{if(e.target.dataset.i!==undefined)wa(window.filteredRows[Number(e.target.dataset.i)])});function exportCSV(){csv([['Date','Time','Programme','Batch','Type','Topic','Presenter','Senior faculty','Junior faculty','Venue'],...filtered().map(x=>[x.date,x.time,x.audience,x.batch,x.type,x.topic,x.presenter,x.senior,x.junior,x.venue])],'Academic_Schedule.csv')}(async()=>{if(await initialize()){try{all=await fetch('academic_sessions.json').then(r=>r.json());let ov=await request('gs_academic_overrides');all.push(...ov.map(x=>({date:x.entry_date,time:x.entry_time,audience:x.audience,batch:x.batch,topic:x.topic,type:'Added session',presenter:x.presenter,senior:x.senior_faculty,junior:x.junior_faculty,venue:x.venue})));options('m',all.map(x=>x.date.slice(0,7)));options('b',all.map(x=>x.batch));options('f',all.flatMap(x=>[x.senior,x.junior]));options('p',all.filter(x=>x.audience==='PG').map(x=>x.presenter));render();notice(all.length+' timetable sessions loaded')}catch(e){notice(e.message,true)}}})();</script></body></html>
