<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UG Attendance Student</title><style>body{background:#eff8f8;font:16px Arial;color:#00383d;margin:0}header{background:#00383d;color:white;padding:20px;text-align:center}main{max-width:500px;margin:30px auto;padding:22px;background:white;border-radius:12px}label{display:block;margin:12px 0 5px;font-weight:bold}input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:7px;border:1px solid #accbd0}button{padding:12px;border:0;background:#03666d;color:white;border-radius:7px}#submit{width:100%;margin-top:20px}small{color:#577}</style></head><body><header><h2>IGMCRI General Surgery</h2>UG Attendance Student</header><main><p id="session"></p><label>UG Batch</label><select id="batch"><option value="">Select batch</option><option>2022</option><option>2023</option></select><label>Student Name</label><select id="student" disabled><option>Select batch first</option></select><label>Registration Number</label><input id="reg" readonly><label>Faculty-announced Session Code</label><div style="display:flex;gap:7px"><input type="password" id="code" placeholder="Code announced in class"><button type="button" id="toggle">Show</button></div><button id="submit" disabled>Submit Attendance</button><p><small>This is a QR student form preview; real attendance submission requires server-side validation.</small></p></main><script>let students={};fetch('./students.json').then(r=>r.json()).then(x=>students=x).catch(()=>{});const $=id=>document.getElementById(id),q=new URLSearchParams(location.search);$('session').textContent=q.has('session')?'Session: '+q.get('session'):'Please scan the active faculty QR code';$('batch').onchange=()=>{let sel=$('student');sel.innerHTML='<option value="">Select name</option>';for(const s of students[$('batch').value]||[])sel.add(new Option(s.name+' — '+s.reg,s.reg));sel.disabled=!$('batch').value;$('reg').value=''};$('student').onchange=()=>$('reg').value=$('student').value;$('toggle').onclick=()=>{let el=$('code');el.type=el.type==='password'?'text':'password';$('toggle').textContent=el.type==='password'?'Show':'Hide'}</script></body></html>
