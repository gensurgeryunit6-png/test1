<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PG Logbook</title><link rel="stylesheet" href="style.css"></head><body><script src="shared.js"></script><script>const TABLE="gs_pg_logbook_entries", FIELDS=["entry_date", "pg_name", "batch", "activity_type", "procedure_name", "diagnosis", "faculty_name", "unit", "participation", "remarks"];let rows=[],editId=null; shell("PG Logbook","<div class=\"panel\"><h2>Separate entry form</h2><form class=\"fields\" id=\"entryForm\"><label>Date<input type=\"date\" name=\"entry_date\" required></label><label>Postgraduate name<input type=\"text\" name=\"pg_name\" required></label><label>Batch<input type=\"text\" name=\"batch\"></label><label>Activity type<select name=\"activity_type\"><option value=\"\">Select</option><option>Major OT</option><option>Minor OT</option><option>OPD</option><option>Ward</option><option>Emergency</option><option>Endoscopy</option><option>USG</option><option>Dressing</option><option>Academic</option><option>Research</option><option>Other</option></select></label><label>Case / procedure<textarea name=\"procedure_name\" required></textarea></label><label>Diagnosis<input type=\"text\" name=\"diagnosis\"></label><label>Supervising faculty<input type=\"text\" name=\"faculty_name\"></label><label>Unit<select name=\"unit\"><option value=\"\">Select</option><option>Unit 1</option><option>Unit 2</option><option>Unit 3</option><option>Unit 4</option><option>Unit 5</option><option>Unit 6</option></select></label><label>Participation<select name=\"participation\"><option value=\"\">Select</option><option>Observed</option><option>Assisted</option><option>Performed under supervision</option><option>Performed independently</option><option>Attended</option><option>Presented</option></select></label><label>Remarks<textarea name=\"remarks\"></textarea></label><div class=\"wide actionbar\"><button type=\"submit\">Save to Supabase</button><button type=\"button\" class=\"secondary\" onclick=\"resetForm()\">Clear</button></div></form><div id=\"notice\" class=\"status\">Sign in to access this register.</div></div><div class=\"panel\"><h2>Saved entries</h2><div class=\"toolbar\"><label>Date <input type=\"date\" id=\"dateFilter\" onchange=\"renderRows()\"></label><label>Search name / IP <input id=\"searchFilter\" oninput=\"renderRows()\" placeholder=\"Search\"></label><button onclick=\"exportRows()\">Download CSV</button><button onclick=\"print()\">Print / Save PDF</button></div><div class=\"scroll\"><table><thead><tr><th>Date</th><th>Postgraduate name</th><th>Batch</th><th>Activity type</th><th>Case / procedure</th><th>Diagnosis</th><th>Supervising faculty</th><th>Unit</th><th>Participation</th><th>Remarks</th><th class=\"no-print\">Actions</th></tr></thead><tbody id=\"records\"></tbody></table></div></div>");
 function resetForm(){document.getElementById('entryForm').reset();document.querySelector('[name=entry_date]').value=today();editId=null}
 async function loadRows(){try{rows=await request(TABLE,'GET',null,null,'select=*&order=entry_date.desc&limit=1000');renderRows();notice('Connected to Supabase · '+rows.length+' records loaded')}catch(e){notice(e.message,true)}}
 function visibleRows(){const day=document.getElementById('dateFilter').value,q=document.getElementById('searchFilter').value.toLowerCase();return rows.filter(r=>(!day||r.entry_date===day)&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}
 function renderRows(){document.getElementById('records').innerHTML=visibleRows().map(r=>'<tr>'+FIELDS.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'<td class="no-print"><button class="secondary" data-edit="'+r.id+'">Edit</button> <button data-delete="'+r.id+'">Delete</button>'+ (TABLE==='gs_pg_logbook_entries'? ' <button class="secondary" data-pdf="'+r.id+'">Entry PDF</button>':'')+'</td></tr>').join('')||'<tr><td colspan="20" class="empty">No matching entries</td></tr>'}
 document.getElementById('records').addEventListener('click',async e=>{const id=e.target.dataset.edit||e.target.dataset.delete||e.target.dataset.pdf;if(!id)return;const r=rows.find(x=>x.id===id);if(e.target.dataset.pdf){document.getElementById('dateFilter').value=r.entry_date;document.getElementById('searchFilter').value=r.pg_name;renderRows();print();return}if(e.target.dataset.edit){editId=id;FIELDS.forEach(k=>{const x=document.querySelector('[name='+k+']');if(x)x.value=r[k]??''});window.scrollTo(0,0)}else if(confirm('Delete this entry from Supabase?')){try{await request(TABLE,'DELETE',null,id);await loadRows()}catch(err){notice(err.message,true)}}});
 document.getElementById('entryForm').addEventListener('submit',async e=>{e.preventDefault();let obj=Object.fromEntries(new FormData(e.target));if(obj.age)obj.age=Number(obj.age);else delete obj.age;Object.keys(obj).forEach(k=>{if(obj[k]==='')obj[k]=null});try{await request(TABLE,editId?'PATCH':'POST',editId?obj:{...obj,owner_id:session.user.id},editId);resetForm();await loadRows();notice('Saved successfully to Supabase')}catch(err){notice(err.message,true)}});
 function exportRows(){csv([FIELDS,...visibleRows().map(r=>FIELDS.map(k=>r[k]))],TABLE+'_'+today()+'.csv')}
 (async()=>{if(await initialize()){resetForm();await loadRows()}})();</script></body></html>
